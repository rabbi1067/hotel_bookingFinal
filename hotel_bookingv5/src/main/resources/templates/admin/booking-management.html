<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head-common :: head-common}"></th:block>
  <title>Booking Management | Admin</title>
  <style>
    .toolbar{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-bottom:1.2rem}
    .toolbar .input-affix{width:260px}
    .pay-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.2rem}
    .tbl th,.tbl td{vertical-align:middle}
    .tbl td.actions{white-space:nowrap;text-align:right;min-width:310px}
    .tbl td.actions .btn{height:34px;min-width:0;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
    .tbl td.actions .btn-ghost{width:34px}
    .table-wrap{overflow-x:auto}
    @media(max-width:1200px){.tbl td.actions{min-width:280px}}
  </style>
</head>

<body data-chrome="dash" data-active="ab">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <header class="topbar" id="topbar"></header>
  <main>
    <div class="page-wrap">
      <div class="section-title"><div class="eyebrow">Housekeeping</div><h2 style="font-family:var(--display)">Bookings</h2><p>Confirm, cancel and manage every reservation across the resort.</p></div>

      <div class="pay-tot" id="bTotals"></div>

      <div class="card">
        <div class="card-head">
          <div class="toolbar" style="margin:0">
            <div class="input-affix"><span data-icon="search"></span><input class="input" id="bkSearch" placeholder="Search booking, guest or room..."></div>
            <select class="input" id="bkStatus" style="width:auto"><option value="">All statuses</option><option>confirmed</option><option>active</option><option>pending</option><option>completed</option><option>cancelled</option></select>
            <select class="input" id="bkPay" style="width:auto"><option value="">All payments</option><option>paid</option><option>unpaid</option></select>
            <input class="input" type="date" id="bkFrom" title="From date" style="width:auto">
            <input class="input" type="date" id="bkTo" title="To date" style="width:auto">
            <button class="btn btn-soft" id="bkReset">Reset</button>
          </div>
        </div>
        <div class="table-wrap" style="border:0;box-shadow:none;border-radius:0"><table class="tbl" id="bkTable"></table></div>
        <div id="bkPager"></div>
      </div>
    </div>
  </main>
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  window.__SERVER_BOOKINGS__ = /*[[${bookingsForJs}]]*/ [];
  /*]]>*/
</script>
<script th:src="@{/js/core.js}"></script>
<script>

  App.boot({guard:'staff'});
  App.renderDashChrome('ab','Booking Management',[{label:'Dashboard',href:'/admin/dashboard'},{label:'Bookings',href:'#'}]);
  (function(){
    var st={q:'',status:'',pay:'',from:'',to:'',page:1,per:7};
    (function(){ var g=new URLSearchParams(location.search).get('g'); if(g){ var u=App.getUsers().filter(function(x){return x.email.toLowerCase()===g.toLowerCase();})[0]; if(u)st.q=u.name; } })();
    var all=App.getBookings();
    var guestPreset=new URLSearchParams(location.search).get('g');
    if(guestPreset){ document.getElementById('bkSearch').value=st.q; }
    var totals=document.getElementById('bTotals');
    var revenue=all.filter(function(b){return b.payment==='paid';}).reduce(function(a,b){return a+b.totalAmount;},0);
    var pending=all.filter(function(b){return b.payment==='unpaid'&&b.status!=='cancelled';});
    var active=all.filter(function(b){return b.status==='active'||b.status==='confirmed';});
    totals.innerHTML=
            '<div class="kpi"><div class="ico ico-accent">'+App.icon('bookmark','icon')+'</div><div><div class="k-val">'+all.length+'</div><div class="k-lab">Total bookings</div></div></div>'+
            '<div class="kpi"><div class="ico ico-success">'+App.icon('door','icon')+'</div><div><div class="k-val">'+active.length+'</div><div class="k-lab">Active / confirmed</div></div></div>'+
            '<div class="kpi"><div class="ico ico-success">'+App.icon('dollar','icon')+'</div><div><div class="k-val">'+App.money(revenue)+'</div><div class="k-lab">Revenue collected</div></div></div>'+
            '<div class="kpi"><div class="ico ico-danger">'+App.icon('card','icon')+'</div><div><div class="k-val">'+App.money(pending.reduce(function(a,b){return a+b.totalAmount;},0))+'</div><div class="k-lab">Pending ('+pending.length+')</div></div></div>';

    var tbl=document.getElementById('bkTable');
    function filtered(){
      return all.filter(function(b){
        if(st.status&&b.status!==st.status)return false;
        if(st.pay&&b.payment!==st.pay)return false;
        if(st.from&&b.checkIn<st.from)return false;
        if(st.to&&b.checkOut>st.to)return false;
        if(st.q){ var h=(b.bookingId+' '+b.guest+' '+b.roomName+' '+b.roomType).toLowerCase(); if(h.indexOf(st.q.toLowerCase())===-1)return false; }
        return true;
      });
    }
    function render(){
      var res=filtered().sort(function(a,b){var ad=Date.parse(a.createdAt||a.checkIn||0), bd=Date.parse(b.createdAt||b.checkIn||0); return bd-ad || String(b.id).localeCompare(String(a.id));});
      var pages=Math.max(1,Math.ceil(res.length/st.per));
      if(st.page>pages)st.page=pages;
      var slice=res.slice((st.page-1)*st.per,st.page*st.per);
      if(!res.length){ tbl.innerHTML='<tr><td colspan="10" style="padding:2rem;text-align:center;color:var(--muted)">'+'No bookings match your filters.'+'</td></tr>'; }
      else tbl.innerHTML='<thead><tr><th>Booking</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Guests</th><th>Amount</th><th>Payment</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+
              slice.map(function(b){
                return '<tr data-bk="'+b.id+'">'+
                        '<td class="primary-id">'+b.bookingId+'</td>'+
                        '<td><div class="cell-user">'+App.avatarHTML(App.userById(b.userId)||{name:b.guest},'avatar sm')+'<div><div class="nm">'+App.esc(b.guest)+'</div><div class="em">'+((b.contact&&b.contact.email)||'')+'</div></div></div></td>'+
                        '<td><div class="cell-room"><img src="'+b.roomImage+'" alt=""><div><div class="rn">'+App.esc(b.roomName)+'</div><div class="rt">'+b.roomType+'</div></div></div></td>'+
                        '<td>'+App.fmtDate(b.checkIn)+'</td><td>'+App.fmtDate(b.checkOut)+'</td>'+
                        '<td>'+b.adults+(b.children?'+'+b.children:'')+(b.pets?' +pet':'')+'</td>'+
                        '<td class="amt">'+App.money(b.totalAmount)+'</td>'+
                        '<td><span class="badge '+(b.payment==='paid'?'b-success':'b-warning')+'">'+(b.payment==='paid'?'Paid':'Unpaid')+'</span></td>'+
                        '<td><span class="badge '+sb(b.status)+'">'+App.cap(b.status)+'</span></td>'+
                        '<td class="actions">'+
                        '<button class="btn btn-ghost btn-sm" data-view="'+b.id+'" title="View">'+App.icon('eye','icon')+'</button>'+
                        (b.status==='pending'?'<button class="btn btn-soft btn-sm" data-confirm="'+b.id+'">Confirm</button>':'')+
                        (b.payment==='unpaid'&&b.status!=='cancelled'?'<button class="btn btn-outline btn-sm" data-pay="'+b.id+'">Mark paid</button>':'')+
                        ((b.status==='confirmed'||b.status==='pending')?'<button class="btn btn-danger btn-sm" data-cancel="'+b.id+'">Cancel</button>':'')+
                        '</td></tr>';
              }).join('')+'</tbody>';
      document.getElementById('bkPager').innerHTML=App.pagination(st.page,pages,function(){});
      App.initPager(document.getElementById('bkPager'),function(p){ st.page=p; render(); });
    }
    function sb(s){ return {confirmed:'b-primary',active:'b-success',completed:'b-info',pending:'b-warning',cancelled:'b-danger'}[s]||'b-plain'; }

    document.getElementById('bkSearch').addEventListener('input',App.debounce(function(){ st.q=this.value; st.page=1; render(); },250));
    document.getElementById('bkStatus').addEventListener('change',function(){ st.status=this.value; st.page=1; render(); });
    document.getElementById('bkPay').addEventListener('change',function(){ st.pay=this.value; st.page=1; render(); });
    document.getElementById('bkFrom').addEventListener('change',function(){ st.from=this.value; st.page=1; render(); });
    document.getElementById('bkTo').addEventListener('change',function(){ st.to=this.value; st.page=1; render(); });
    document.getElementById('bkReset').addEventListener('click',function(){ st={q:'',status:'',pay:'',from:'',to:'',page:1,per:7}; ['bkSearch','bkStatus','bkPay','bkFrom','bkTo'].forEach(function(id){ var el=document.getElementById(id); el.value=id==='bkStatus'?'':id==='bkPay'?'':''; }); render(); });

    tbl.addEventListener('click',function(e){
      var view=e.target.closest('[data-view]');
      if(view){ showModal(App.bookingById(view.dataset.view)); }
      var conf=e.target.closest('[data-confirm]');
      if(conf){ serverAction(conf.dataset.confirm,'confirm'); }
      var pay=e.target.closest('[data-pay]');
      if(pay){ App.openConfirm('Mark as paid?','Mark booking as Paid? This simulates receiving payment through a gateway.').then(function(ok){ if(!ok)return; serverAction(pay.dataset.pay,'mark-paid'); }); }
      var cxl=e.target.closest('[data-cancel]');
      if(cxl){ App.openConfirm('Cancel booking?','This will cancel the booking and is not reversible.').then(function(ok){ if(!ok)return; serverAction(cxl.dataset.cancel,'cancel'); }); }
    });
    function serverAction(id,action){
      var form=document.createElement('form');
      form.method='POST'; form.action='/admin/bookings/'+id+'/'+action; form.style.display='none';
      document.body.appendChild(form);
      form.submit();
    }
    function showModal(b){
      if(!b){ App.toast('Booking not found.','error'); return; }
      var m=App.openModal('<div class="modal lg"><div class="modal-head"><h3>'+b.bookingId+'</h3><button class="modal-x">&times;</button></div><div class="modal-body">'+
              '<div class="join-grid mb-3">'+
              '<div class="join-cell"><div class="k">Guest</div><div class="v">'+App.esc(b.guest)+'</div></div>'+
              '<div class="join-cell"><div class="k">Room</div><div class="v">'+App.esc(b.roomName)+'</div></div>'+
              '<div class="join-cell"><div class="k">Check-in</div><div class="v">'+App.fmtDate(b.checkIn)+'</div></div>'+
              '<div class="join-cell"><div class="k">Check-out</div><div class="v">'+App.fmtDate(b.checkOut)+'</div></div>'+
              '<div class="join-cell"><div class="k">Guests</div><div class="v">'+b.adults+'a'+(b.children?' / '+b.children+'c':'')+'</div></div>'+
              '<div class="join-cell"><div class="k">Nights</div><div class="v">'+b.nights+'</div></div>'+
              '<div class="join-cell"><div class="k">Services total</div><div class="v">'+App.money(b.servicesTotal)+'</div></div>'+
              '<div class="join-cell"><div class="k">Tax</div><div class="v">'+App.money(b.taxAmount)+'</div></div>'+
              '</div>'+
              '<div class="sum-total"><span class="k">Total</span><span class="v">'+App.money(b.totalAmount)+'</span></div>'+
              (b.contact&&b.contact.request?'<div class="mt-3 text-sm" style="color:var(--muted)"><b>Special request:</b> '+App.esc(b.contact.request)+'</div>':'')+
              '<div class="row mt-3" style="gap:.5rem;flex-wrap:wrap"><a class="btn btn-primary btn-sm" href="/user/booking-details?id='+b.id+'">Open guest view</a>'+(b.payment==='unpaid'?'<button class="btn btn-soft btn-sm" data-mpay="'+b.id+'">Mark paid</button>':'')+(b.status==='pending'?'<button class="btn btn-soft btn-sm" data-mconf="'+b.id+'">Confirm</button>':'')+'</div>'+
              '</div></div>');
      var mp=m.q('[data-mpay]'); if(mp)mp.addEventListener('click',function(){ serverAction(b.id,'mark-paid'); });
      var mc=m.q('[data-mconf]'); if(mc)mc.addEventListener('click',function(){ serverAction(b.id,'confirm'); });
    }
    render();
  })();
</script>
</body>
</html>
