<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head-common :: head-common}"></th:block>
  <title>Discounts & Offers | Admin</title>
  <style>
    .off-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
    .off-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
    .off-card::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
    .off-pct{font-size:2rem;font-weight:800;font-family:var(--display);letter-spacing:-.03em;line-height:1.1}
    .off-tag{position:absolute;top:1rem;right:1rem}
  </style>
</head>

<body data-chrome="dash" data-active="ado">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <header class="topbar" id="topbar"></header>
  <main>
    <div class="page-wrap">
      <div class="row between wrap mb-3">
        <div class="section-title" style="margin:0"><div class="eyebrow">Seasonal offers</div><h2 style="font-family:var(--display)">Room discounts</h2><p>Percentage or fixed-amount room deals, separate from promo codes.</p></div>
        <button class="btn btn-primary" id="addOff"><span data-icon="plus" class="icon" style="width:16px;height:16px"></span> New discount</button>
      </div>
      <div class="off-grid" id="offGrid"></div>
    </div>
  </main>
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  // Real rooms from the DB (see the controller for this page - it must add
  // "roomsForJs" the same way AdminRoomController does for room-management).
  // Without this, App.getRooms() silently falls back to old demo/mock rooms
  // (ids like "r1".."r7"), which is why "Apply to room" used to show the
  // wrong list and never matched a real Room.
  window.__SERVER_ROOMS__ = /*[[${roomsForJs}]]*/ [];
  /*]]>*/
</script>
<script th:src="@{/js/core.js}"></script>
<script>

  App.boot({guard:'admin'});
  App.renderDashChrome('ado','Discounts & Offers',[{label:'Dashboard',href:'/admin/dashboard'},{label:'Discounts',href:'#'}]);
  (function(){
    var API='/api/admin/promotions';
    var grid=document.getElementById('offGrid');
    var st={data:[]};

    function api(url,opts){
      return fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opts||{}))
              .then(function(res){
                if(!res.ok){
                  return res.json().catch(function(){ return {}; }).then(function(body){
                    throw new Error(body.message||'Request failed.');
                  });
                }
                if(res.status===204) return null;
                return res.text().then(function(t){ return t?JSON.parse(t):null; });
              });
    }

    function all(){ return st.data; }

    function load(){
      return api(API).then(function(list){
        st.data=list||[];
        render();
      }).catch(function(err){
        App.toast(err.message||'Failed to load discounts.','danger');
      });
    }

    function badgeOf(d){
      if(d.status==='paused')return '<span class="badge b-plain">Paused</span>';
      if(d.status==='expired')return '<span class="badge b-plain">Expired</span>';
      if(d.status==='upcoming')return '<span class="badge b-info">Upcoming</span>';
      if(d.status==='active')return '<span class="badge b-success">Active</span>';
      return '<span class="badge b-plain">Expired</span>';
    }
    function isActive(d){ return d.status==='active'; }
    function discountLabel(d){
      if(d.type==='fixed') return '-'+App.money(d.value);
      return '-'+d.value+'%';
    }
    function render(){
      var list=all();
      if(!list.length){ grid.innerHTML=App.emptyState('tag','No discounts yet','Create a seasonal offer or room deal to boost occupancy.','<button class="btn btn-soft btn-sm" onclick="document.getElementById(\'addOff\').click()">New discount</button>'); return; }
      grid.innerHTML=list.map(function(d){
        var r=d.roomId?App.roomById(d.roomId):null;
        var rooms=r?r.name:'';
        return '<div class="off-card" data-id="'+d.id+'">'+
                '<span class="off-tag">'+badgeOf(d)+'</span>'+
                '<div class="off-pct">'+discountLabel(d)+'</div>'+
                '<div class="strong mt-1" style="font-size:1.05rem">'+App.esc(d.title)+'</div>'+
                '<p class="text-sm mt-1" style="color:var(--muted)">'+App.esc(d.description||'')+'</p>'+
                '<div class="text-sm mt-2" style="display:flex;flex-direction:column;gap:.2rem;color:var(--muted)">'+
                '<span><span data-icon="bed" style="width:13px;height:13px"></span> '+App.esc(rooms||'All rooms')+'</span>'+
                '<span><span data-icon="calendar" style="width:13px;height:13px"></span> '+App.dateStr(d.start)+' &rarr; '+App.dateStr(d.end)+'</span>'+
                (d.minStay?'<span><span data-icon="clock" style="width:13px;height:13px"></span> Min '+d.minStay+' nights</span>':'')+
                '</div>'+
                '<div class="row mt-3" style="gap:.45rem">'+
                '<button class="btn btn-outline btn-sm grow" data-edit="'+d.id+'">Edit</button>'+
                '<button class="btn btn-ghost btn-sm" data-toggle="'+d.id+'"'+(d.status==='expired'?' disabled title="Expired — edit to reactivate" style="opacity:.4;cursor:not-allowed"':'')+'>'+(d.status==='expired'?'Expired':(isActive(d)||d.status==='paused'?'Pause':'Activate'))+'</button>'+
                '<button class="btn btn-danger btn-sm" data-del="'+d.id+'">'+App.icon('trash','icon-sm')+'</button>'+
                '</div></div>';
      }).join('');
      grid.querySelectorAll('[data-edit]').forEach(function(b){ b.addEventListener('click',function(){ edit(all().find(function(d){return String(d.id)===b.dataset.edit;})); }); });
      grid.querySelectorAll('[data-toggle]').forEach(function(b){ b.addEventListener('click',function(){
        if(b.disabled)return;
        var d=all().find(function(x){return String(x.id)===b.dataset.toggle;});
        api(API+'/'+d.id+'/toggle',{method:'PATCH'}).then(function(){
          App.toast(isActive(d)?'Discount paused.':'Discount activated.');
          load();
        }).catch(function(err){ App.toast(err.message||'Could not update discount.','danger'); });
      }); });
      grid.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click',function(){
        var d=all().find(function(x){return String(x.id)===b.dataset.del;});
        App.openConfirm('Delete discount?','"'+App.esc(d.title)+'" will be removed permanently.',{variant:'danger',confirmText:'Delete'}).then(function(ok){
          if(!ok)return;
          api(API+'/'+d.id,{method:'DELETE'}).then(function(){
            App.toast('Discount deleted.','info');
            load();
          }).catch(function(err){ App.toast(err.message||'Could not delete discount.','danger'); });
        });
      }); });
    }
    function edit(d){
      App.openForm(d?'Edit discount':'New discount',[
        {id:'dTitle',label:'Offer title',type:'text',req:true,value:d?d.title:'',placeholder:'e.g. Summer Escape'},
        {id:'dType',label:'Discount type',type:'select',value:d?(d.type||'percent'):'percent',options:['percent:Percentage (%)','fixed:Fixed amount ($)']},
        {id:'dValue',label:'Discount value',type:'number',req:true,value:d?d.value:10,placeholder:'10 for 10%, 50 for $50'},
        {id:'dStart',label:'Start date',type:'date',value:d?d.start:''},
        {id:'dEnd',label:'End date',type:'date',value:d?d.end:''},
        {id:'dMin',label:'Min nights (optional)',type:'number',value:d?(d.minStay||''):''},
        {id:'dStatus',label:'Status',type:'select',value:d?(d.status||'active'):'active',options:['active:Active','paused:Paused','upcoming:Upcoming','expired:Expired']},
        // Now sourced from the real DB room list (App.getRooms() reads
        // window.__SERVER_ROOMS__ above) - every room the admin has added
        // shows up here, and the value saved is the room's real id.
        {id:'dRoom',label:'Apply to room',type:'select',value:d&&d.roomId?String(d.roomId):'',options:[' :All rooms'].concat(App.getRooms().map(function(r){return r.id+':'+r.name;}))},
        {id:'dDesc',label:'Short description',type:'text',value:d?d.description||'':''}
      ],d?'Save changes':'Create discount').then(function(v){
        if(!v)return;
        var payload={
          title:v.dTitle, type:v.dType, value:+v.dValue||0,
          start:v.dStart||null, end:v.dEnd||null,
          minStay:+v.dMin||0, description:v.dDesc||'',
          roomId:(v.dRoom||'').trim()||null, code:d?d.code:'',
          status:v.dStatus||'active', featured:d?d.featured:false
        };
        if(!payload.title){ App.toast('Offer title required.','warning'); return; }
        var req=d?api(API+'/'+d.id,{method:'PUT',body:JSON.stringify(payload)})
                :api(API,{method:'POST',body:JSON.stringify(payload)});
        req.then(function(){
          App.toast(d?'Discount updated.':'Discount created.');
          load();
        }).catch(function(err){ App.toast(err.message||'Could not save discount.','danger'); });
      });
    }
    document.getElementById('addOff').addEventListener('click',function(){ edit(null); });
    load();
  })();
</script>
</body>
</html>
