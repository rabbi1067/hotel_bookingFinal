<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/head-common :: head-common}"></th:block>
  <title>Room Management | Admin</title>
  <style>
    .pm-filterbar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
    .pm-filterbar .input-affix{width:250px}
    .rm-count{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.2rem}
    .rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:1.2rem;padding:1.2rem}
    .rm-card{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s}
    .rm-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .rm-card-img{height:185px;position:relative;background:linear-gradient(135deg,#0d3a36,#14443f);overflow:hidden}
    .rm-card-img img{width:100%;height:100%;object-fit:cover;display:block}
    .rm-card-body{padding:1rem}
    .rm-card-top,.rm-card-meta,.rm-card-foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
    .rm-card-type{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--primary)}
    .rm-card-title{font-size:1.08rem;margin:.35rem 0 .55rem;font-family:var(--display)}
    .rm-card-meta{justify-content:flex-start;color:var(--muted);font-size:.82rem;flex-wrap:wrap;margin-bottom:.8rem}
    .rm-card-price{font-size:1.15rem;font-weight:750;color:var(--text)}
    .rm-card-price small{font-size:.75rem;font-weight:400;color:var(--muted)}
    .rm-card-foot{border-top:1px solid var(--border);padding-top:.8rem;margin-top:.8rem}
    .rm-actions{display:flex;gap:.25rem}
    .rm-empty{grid-column:1/-1;padding:2.4rem;text-align:center;color:var(--muted)}
    @media(max-width:640px){.rm-grid{grid-template-columns:1fr;padding:.8rem}.rm-card-img{height:210px}}
  </style>
</head>

<body data-chrome="dash" data-active="ar">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <header class="topbar" id="topbar"></header>
  <main>
    <div class="page-wrap">
      <div class="row between wrap mb-3">
        <div class="section-title" style="margin:0"><div class="eyebrow">Inventory</div><h2 style="font-family:var(--display)">Rooms</h2><p>Manage all property rooms — edit, duplicate, toggle availability, or remove.</p></div>
        <button class="btn btn-primary" id="rmAdd"><span data-icon="plus" class="icon" style="width:16px;height:16px"></span> Add room</button>
      </div>

      <div class="rm-count" id="rmTotals"></div>

      <div class="card">
        <div class="card-head">
          <div class="pm-filterbar">
            <div class="input-affix"><span data-icon="search"></span><input class="input" id="rmSearch" placeholder="Search room number, name or type..."></div>
            <select class="input" id="rmStatus" style="width:auto"><option value="">All statuses</option><option>available</option><option>occupied</option><option>reserved</option><option>maintenance</option><option>cleaning</option></select>
            <select class="input" id="rmType" style="width:auto"><option value="">All types</option><option>Single</option><option>Double</option><option>Twin</option><option>Deluxe</option><option>Suite</option><option>Family</option><option>Premium</option></select>
            <button class="btn btn-soft" id="rmReset">Reset</button>
          </div>
        </div>
        <div class="rm-grid" id="rmGrid"></div>
        <div id="rmPager" style="padding:0 1.2rem 1.2rem"></div>
      </div>
    </div>
  </main>
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  window.__SERVER_ROOMS__ = /*[[${roomsForJs}]]*/ [];
  /*]]>*/
</script>
<!-- Flash message from a redirect after add/edit/delete/duplicate/toggle-availability. -->
<script th:if="${roomActionMsg}" th:inline="javascript">
  /*<![CDATA[*/
  window.__ROOM_FLASH__ = {
    ok: /*[[${roomActionOk}]]*/ true,
    msg: /*[[${roomActionMsg}]]*/ ''
  };
  /*]]>*/
</script>
<script th:src="@{/js/core.js}"></script>
<script>

  App.boot({guard:'staff'});
  App.renderDashChrome('ar','Room Management',[{label:'Dashboard',href:'/admin/dashboard'},{label:'Rooms',href:'#'}]);
  (function(){
    var all=App.getRooms();
    var st={q:'',status:'',type:'',page:1,per:8};

    // Show a popup for whatever action just happened (add / edit / delete / duplicate / toggle).
    // On success -> green toast; on failure (e.g. "room has existing bookings") -> red toast
    // instead of letting the request fail silently or show a blank/white error page.
    if(window.__ROOM_FLASH__){
      App.toast(window.__ROOM_FLASH__.msg, window.__ROOM_FLASH__.ok ? 'success' : 'error');
    }

    function totals(){
      var avail=all.filter(function(r){return r.status==='available';}).length;
      var occupied=all.filter(function(r){return r.status==='occupied';}).length;
      var maint=all.filter(function(r){return r.status==='maintenance';}).length;
      document.getElementById('rmTotals').innerHTML=
              '<div class="kpi"><div class="ico ico-primary">'+App.icon('bed','icon')+'</div><div><div class="k-val">'+all.length+'</div><div class="k-lab">Total rooms</div></div></div>'+
              '<div class="kpi"><div class="ico ico-success">'+App.icon('door','icon')+'</div><div><div class="k-val">'+avail+'</div><div class="k-lab">Available</div></div></div>'+
              '<div class="kpi"><div class="ico ico-warning">'+App.icon('lock','icon')+'</div><div><div class="k-val">'+occupied+'</div><div class="k-lab">Occupied</div></div></div>'+
              '<div class="kpi"><div class="ico ico-danger">'+App.icon('wrench','icon')+'</div><div><div class="k-val">'+maint+'</div><div class="k-lab">Maintenance</div></div></div>';
    }

    function filtered(){
      return all.filter(function(r){
        if(st.status&&r.status!==st.status)return false;
        if(st.type&&r.type!==st.type)return false;
        if(st.q){ var h=(r.number+' '+r.name+' '+r.type).toLowerCase(); if(h.indexOf(st.q.toLowerCase())===-1)return false; }
        return true;
      });
    }

    function statusBadge(s){
      var map={available:'b-success',occupied:'b-warning',reserved:'b-plain',maintenance:'b-danger',cleaning:'b-info'};
      return '<span class="badge '+(map[s]||'b-plain')+'">'+App.cap(s)+'</span>';
    }

    function render(){
      var res=filtered().sort(function(a,b){return a.number.localeCompare(b.number);});
      var pages=Math.max(1,Math.ceil(res.length/st.per));
      if(st.page>pages)st.page=pages;
      var slice=res.slice((st.page-1)*st.per,st.page*st.per);
      var grid=document.getElementById('rmGrid');
      var pager=document.getElementById('rmPager');
      if(!all.length){
        grid.innerHTML='<div class="rm-empty">No rooms yet. Add your first room above.</div>';
        pager.innerHTML='';
        return;
      }
      if(!slice.length){
        grid.innerHTML='<div class="rm-empty">No rooms match your search or filters.</div>';
        pager.innerHTML='';
        return;
      }
      grid.innerHTML=
              slice.map(function(r){
                var imgSrc=(r.images&&r.images[0])?r.images[0]:'';
                return '<article class="rm-card" data-rm="'+r.id+'">'+
                        '<div class="rm-card-img"><img src="'+imgSrc+'" alt="'+App.esc(r.name)+'" loading="lazy" onerror="this.style.display=\'none\'"></div>'+
                        '<div class="rm-card-body">'+
                        '<div class="rm-card-top"><span class="rm-card-type">'+App.esc(r.type)+'</span>'+statusBadge(r.status)+'</div>'+
                        '<h3 class="rm-card-title">'+App.esc(r.name)+'</h3>'+
                        '<div class="rm-card-meta"><span>Room #'+App.esc(r.number)+'</span><span>•</span><span>'+r.capacity+' guest'+(r.capacity!==1?'s':'')+'</span></div>'+
                        '<div class="rm-card-foot"><div class="rm-card-price">'+App.money(r.price)+' <small>/ night</small></div>'+
                        '<div class="rm-actions">'+
                        '<button class="btn btn-ghost btn-sm" data-edit="'+r.id+'" title="Edit">'+App.icon('edit','icon')+'</button>'+
                        '<button class="btn btn-ghost btn-sm" data-dup="'+r.id+'" title="Duplicate">'+App.icon('copy','icon')+'</button>'+
                        '<button class="btn btn-ghost btn-sm" data-toggle="'+r.id+'" title="Toggle">'+App.icon('power','icon')+'</button>'+
                        '<button class="btn btn-danger btn-sm" data-del="'+r.id+'" title="Delete">'+App.icon('trash','icon')+'</button>'+
                        '</div></div></div></article>';
              }).join('');
      App.hydrateIcons(grid);
      pager.innerHTML=App.pagination(st.page,pages,function(p){
        st.page=p;
        render();
        window.scrollTo({top:0,behavior:'smooth'});
      });
      App.initPager(pager,function(p){
        st.page=p;
        render();
        window.scrollTo({top:0,behavior:'smooth'});
      });
    }

    function serverAction(id,action){
      var form=document.createElement('form');
      form.method='POST'; form.action='/admin/rooms/'+id+'/'+action; form.style.display='none';
      document.body.appendChild(form);
      form.submit();
    }

    document.getElementById('rmGrid').addEventListener('click',function(e){
      var edit=e.target.closest('[data-edit]');
      if(edit){ location.href='/admin/room-form?id='+edit.dataset.edit; return; }
      var dup=e.target.closest('[data-dup]');
      if(dup){ serverAction(dup.dataset.dup,'duplicate'); return; }
      var toggle=e.target.closest('[data-toggle]');
      if(toggle){ serverAction(toggle.dataset.toggle,'toggle-availability'); return; }
      var del=e.target.closest('[data-del]');
      if(del){
        var r=App.roomById(del.dataset.del);
        App.openConfirm('Delete room?','Room "'+(r?r.number:'')+'" will be permanently removed.',{variant:'danger',confirmText:'Delete'}).then(function(ok){
          if(!ok)return;
          serverAction(del.dataset.del,'delete');
        });
      }
    });

    document.getElementById('rmSearch').addEventListener('input',App.debounce(function(){ st.q=this.value; st.page=1; render(); },250));
    document.getElementById('rmStatus').addEventListener('change',function(){ st.status=this.value; st.page=1; render(); });
    document.getElementById('rmType').addEventListener('change',function(){ st.type=this.value; st.page=1; render(); });
    document.getElementById('rmReset').addEventListener('click',function(){
      st={q:'',status:'',type:'',page:1,per:8};
      ['rmSearch','rmStatus','rmType'].forEach(function(id){ document.getElementById(id).value=''; });
      render();
    });
    document.getElementById('rmAdd').addEventListener('click',function(){ location.href='/admin/room-form'; });

    totals(); render();
  })();
</script>
</body>
</html>
